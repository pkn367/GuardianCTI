<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GuardianCTI — cloud security posture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="data.js" onerror="void 0"></script>
<style>
  :root{
    --ground:#eef1f1; --panel:#ffffff; --ink:#16232b; --muted:#5e7180;
    --rule:#d6dee0; --trace:#0f8c7a; --alarm:#c1302a; --caution:#c07c00;
    --calm:#3a6ea5; --quiet:#6b8a7a;
    --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
       font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1140px;margin:0 auto;padding:28px 20px 72px}

  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;
         padding-bottom:14px;border-bottom:2px solid var(--ink);margin-bottom:22px}
  header h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.015em}
  header .sub{color:var(--muted);font-size:13.5px}
  header .stamp{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}

  /* ---- vitals trace: the hero ---- */
  .vitals{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(220px,1fr);
          gap:0;background:var(--panel);border:1px solid var(--rule);margin-bottom:22px}
  .trace{padding:18px 18px 8px;border-right:1px solid var(--rule)}
  .trace h2{margin:0 0 2px;font-size:13px;font-weight:600;color:var(--muted)}
  .trace p{margin:0 0 10px;font-size:12.5px;color:var(--muted)}
  #traceSvg{width:100%;height:170px;display:block}
  .tracePath{fill:none;stroke:var(--trace);stroke-width:2.25;stroke-linejoin:round;stroke-linecap:round}
  .traceFill{fill:var(--trace);opacity:.07}
  .gridline{stroke:var(--rule);stroke-width:1}
  .gridlabel{fill:var(--muted);font-size:10px;font-family:var(--mono)}
  .nowDot{fill:var(--trace)}
  @media(prefers-reduced-motion:no-preference){
    .tracePath{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
               animation:draw 1.1s cubic-bezier(.4,0,.2,1) forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
  }

  .readout{padding:18px}
  .score{font-size:62px;font-weight:600;line-height:.95;letter-spacing:-.03em;
         font-variant-numeric:tabular-nums}
  .score span{font-size:20px;font-weight:400;color:var(--muted)}
  .grade{font-size:13px;color:var(--muted);margin:4px 0 16px}
  .ledger{border-top:1px solid var(--rule)}
  .ledger div{display:flex;justify-content:space-between;gap:12px;
              padding:7px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
  .ledger dt{color:var(--muted)}
  .ledger b{font-weight:500;font-variant-numeric:tabular-nums}

  /* ---- families + intel ---- */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:22px}
  .block{background:var(--panel);border:1px solid var(--rule);padding:18px}
  .block h2{margin:0 0 14px;font-size:13px;font-weight:600;color:var(--muted)}
  .fam{margin-bottom:12px}
  .fam .row{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
  .fam .row b{font-weight:500;font-variant-numeric:tabular-nums}
  .bar{height:7px;background:#e4eaea}
  .bar i{display:block;height:100%}
  .intel{font-size:13.5px}
  .intel .row{display:flex;justify-content:space-between;padding:6px 0;
              border-bottom:1px solid var(--rule)}
  .intel .row:last-child{border-bottom:0}
  .intel code{font-family:var(--mono);font-size:12.5px}
  .live{display:inline-block;width:7px;height:7px;border-radius:50%;
        background:var(--trace);margin-right:6px;vertical-align:1px}
  .live.stale{background:var(--caution)}

  /* ---- findings ledger ---- */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .toolbar h2{margin:0 12px 0 0;font-size:13px;font-weight:600;color:var(--muted)}
  .chip{font:inherit;font-size:13px;padding:4px 11px;border:1px solid var(--rule);
        background:var(--panel);color:var(--muted);cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip:focus-visible{outline:2px solid var(--calm);outline-offset:2px}

  .find{background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--rule);
        margin-bottom:6px}
  .find.Critical{border-left-color:var(--alarm)}
  .find.High{border-left-color:#d4563f}
  .find.Medium{border-left-color:var(--caution)}
  .find.Low{border-left-color:var(--quiet)}
  .find > button{width:100%;display:grid;grid-template-columns:78px 1fr auto;gap:14px;
        align-items:center;background:none;border:0;font:inherit;text-align:left;
        padding:11px 14px;cursor:pointer;color:inherit}
  .find > button:focus-visible{outline:2px solid var(--calm);outline-offset:-2px}
  .rank{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
  .what{min-width:0}
  .what strong{font-weight:500;font-size:14.5px}
  .what em{display:block;font-style:normal;font-size:12.5px;color:var(--muted);
           font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tags{display:flex;gap:6px;align-items:center;flex-shrink:0}
  .sev{font-size:12px;padding:2px 8px;border:1px solid currentColor}
  .Critical .sev,.sev.Critical{color:var(--alarm)}
  .High .sev{color:#b04a34} .Medium .sev{color:var(--caution)} .Low .sev{color:var(--quiet)}
  .anom{font-size:12px;color:var(--calm);border:1px dashed var(--calm);padding:2px 7px}
  .phi{font-size:12px;color:var(--alarm);border:1px solid var(--alarm);padding:2px 7px}
  .detail{display:none;padding:2px 14px 16px 106px;border-top:1px solid var(--rule)}
  .find[open] .detail{display:block}
  .detail dl{display:grid;grid-template-columns:132px 1fr;gap:4px 14px;margin:12px 0;font-size:13.5px}
  .detail dt{color:var(--muted)}
  .detail dd{margin:0}
  .detail pre{font-family:var(--mono);font-size:12.5px;background:var(--ground);
              padding:10px 12px;overflow-x:auto;margin:0;border:1px solid var(--rule)}
  .fix{border-left:2px solid var(--trace);padding-left:12px;margin-top:12px;font-size:13.5px}
  .empty{background:var(--panel);border:1px solid var(--rule);padding:28px;text-align:center;color:var(--muted)}
  footer{margin-top:28px;font-size:12.5px;color:var(--muted)}
  @media(max-width:820px){
    .vitals,.cols{grid-template-columns:1fr}
    .trace{border-right:0;border-bottom:1px solid var(--rule)}
    .find > button{grid-template-columns:60px 1fr;row-gap:6px}
    .tags{grid-column:1/-1}
    .detail{padding-left:14px}
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>GuardianCTI</h1>
  <div class="sub">Cloud security posture, healthcare workload</div>
  <div class="stamp" id="stamp">—</div>
</header>

<section class="vitals">
  <div class="trace">
    <h2>Posture over assessment runs</h2>
    <p id="traceCaption">Each point is one full assessment of the account.</p>
    <svg id="traceSvg" viewBox="0 0 640 170" preserveAspectRatio="none" role="img"
         aria-labelledby="traceCaption"></svg>
  </div>
  <div class="readout">
    <div class="score" id="scoreVal">—<span>/100</span></div>
    <div class="grade" id="gradeVal">no assessment loaded</div>
    <dl class="ledger" id="ledger"></dl>
  </div>
</section>

<div class="cols">
  <div class="block">
    <h2>Control families</h2>
    <div id="families"></div>
  </div>
  <div class="block">
    <h2>Threat intelligence feed</h2>
    <div class="intel" id="intel"></div>
  </div>
</div>

<div class="toolbar" id="toolbar">
  <h2>Open findings</h2>
</div>
<div id="findings"></div>

<footer id="footer"></footer>
</div>

<script>
const SEVS = ["Critical","High","Medium","Low"];
const FAM_COLOR = s => s >= 85 ? "var(--trace)" : s >= 65 ? "var(--calm)" : s >= 40 ? "var(--caution)" : "var(--alarm)";
let DATA = null, HIST = [], filter = "All";

async function load(){
  try{
    const [r, h] = await Promise.all([
      fetch("../out/findings.json", {cache:"no-store"}),
      fetch("../out/history.json", {cache:"no-store"}).catch(()=>null)
    ]);
    if(!r.ok) throw new Error(r.status);
    DATA = await r.json();
    HIST = h && h.ok ? await h.json() : [];
  }catch(e){
    if(window.GUARDIAN_DATA){ DATA = window.GUARDIAN_DATA; HIST = window.GUARDIAN_HISTORY || []; }
  }
  DATA ? render() : showEmpty();
}

function showEmpty(){
  document.getElementById("findings").innerHTML =
    '<div class="empty">No assessment data yet. Run <code>python -m guardian.pipeline --offline</code> '
    + 'from the repository root, then reload this page.</div>';
}

function render(){
  const p = DATA.posture;
  document.getElementById("stamp").textContent =
    DATA.account_region + " · " + new Date(DATA.generated_at).toLocaleString();
  document.getElementById("scoreVal").innerHTML = p.score + "<span>/100</span>";
  document.getElementById("gradeVal").textContent =
    "Grade " + p.grade + " · " + (p.score >= 75 ? "acceptable" : p.score >= 50 ? "needs work" : "not fit for PHI");

  document.getElementById("ledger").innerHTML = [
    ["Checks evaluated", p.checks_evaluated],
    ["Open findings", p.open_findings],
    ["On PHI resources", p.phi_findings],
    ["Critical + High", (p.counts.Critical||0)+(p.counts.High||0)]
  ].map(([k,v]) => `<div><dt>${k}</dt><b>${v}</b></div>`).join("");

  drawTrace(HIST.length ? HIST.map(h=>h.score) : [p.score]);

  document.getElementById("families").innerHTML = Object.entries(p.families)
    .sort((a,b)=>a[1]-b[1])
    .map(([name,score]) => `<div class="fam">
        <div class="row"><span>${name}</span><b>${score}</b></div>
        <div class="bar"><i style="width:${score}%;background:${FAM_COLOR(score)}"></i></div>
      </div>`).join("");

  const c = DATA.cti || {};
  const live = c.source === "live";
  const rows = Object.entries(c.kev_matches || {}).sort((a,b)=>b[1]-a[1]).slice(0,6)
    .map(([svc,n]) => `<div class="row"><span><code>${svc}</code></span><b>${n} exploited CVEs</b></div>`).join("");
  document.getElementById("intel").innerHTML =
    `<div class="row"><span><i class="live ${live?"":"stale"}"></i>CISA KEV catalogue</span>
       <b>${live ? (c.kev_total + " entries") : "cached fallback"}</b></div>` + rows +
    `<div class="row"><span>Fetched</span><b>${c.fetched_at || "—"}</b></div>`;

  const present = SEVS.filter(s => DATA.findings.some(f => f.severity === s));
  document.getElementById("toolbar").insertAdjacentHTML("beforeend",
    ["All", ...present].map(s =>
      `<button class="chip" aria-pressed="${s===filter}" data-sev="${s}">${s}</button>`).join(""));
  document.getElementById("toolbar").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if(!b) return;
    filter = b.dataset.sev;
    document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.sev===filter));
    renderFindings();
  });
  renderFindings();

  document.getElementById("footer").textContent =
    "Mappings: HIPAA Security Rule (45 CFR 164) · CIS AWS Foundations Benchmark v3.0.0 · "
    + "NIST SP 800-53 Rev.5 · MITRE ATT&CK. Synthetic data only.";
}

function renderFindings(){
  const list = DATA.findings.filter(f => filter === "All" || f.severity === filter);
  document.getElementById("findings").innerHTML = list.map((f,i) => `
    <div class="find ${f.severity}" data-i="${i}">
      <button aria-expanded="false">
        <span class="rank">${(f.final_rank ?? f.risk_score).toFixed(2)}</span>
        <span class="what"><strong>${esc(f.title)}</strong><em>${esc(f.resource_id)} · ${f.check_id}</em></span>
        <span class="tags">
          ${f.phi ? '<span class="phi">PHI</span>' : ''}
          ${f.is_anomaly ? '<span class="anom">anomaly</span>' : ''}
          <span class="sev">${f.severity}</span>
        </span>
      </button>
      <div class="detail">
        <dl>
          <dt>Evidence</dt><dd><pre>${esc(JSON.stringify(f.evidence, null, 1))}</pre></dd>
          <dt>Risk</dt><dd>${f.risk_score} = likelihood ${f.likelihood} × impact ${f.impact}, with threat pressure ×${f.threat_pressure} and exposure ×${f.exposure}</dd>
          <dt>Model</dt><dd>priority <b>${f.ai_priority}</b> at ${f.ai_confidence==null?"n/a":(f.ai_confidence*100).toFixed(0)+"% confidence"} · anomaly ${f.anomaly_score}/100</dd>
          <dt>HIPAA</dt><dd>${esc(f.hipaa)}</dd>
          <dt>CIS / NIST</dt><dd>${esc(f.cis)} · ${esc(f.nist)}</dd>
          <dt>ATT&amp;CK</dt><dd>${(f.attack||[]).map((t,j)=>esc(t + (f.attack_names&&f.attack_names[j]&&f.attack_names[j]!==t ? " " + f.attack_names[j] : ""))).join(" · ")}</dd>
        </dl>
        <div class="fix"><b>Fix</b> — ${esc(f.remediation)}</div>
      </div>
    </div>`).join("") || '<div class="empty">Nothing at this severity.</div>';

  document.querySelectorAll(".find > button").forEach(b => b.addEventListener("click", () => {
    const card = b.parentElement, open = card.hasAttribute("open");
    open ? card.removeAttribute("open") : card.setAttribute("open","");
    b.setAttribute("aria-expanded", String(!open));
  }));
}

function drawTrace(scores){
  const svg = document.getElementById("traceSvg"), W = 640, H = 170, pad = 26;
  const pts = scores.length === 1 ? [scores[0], scores[0]] : scores;
  const x = i => pad + i * (W - pad - 34) / (pts.length - 1);
  const y = v => H - pad - (v / 100) * (H - pad * 2);
  let g = "";
  [0,25,50,75,100].forEach(v => {
    g += `<line class="gridline" x1="${pad}" y1="${y(v)}" x2="${W-34}" y2="${y(v)}"/>`
       + `<text class="gridlabel" x="2" y="${y(v)+3}">${v}</text>`;
  });
  const line = pts.map((v,i) => `${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const area = `${line} L${x(pts.length-1).toFixed(1)},${y(0)} L${x(0)},${y(0)} Z`;
  const last = pts[pts.length-1];
  svg.innerHTML = g
    + `<path class="traceFill" d="${area}"/>`
    + `<path class="tracePath" id="tp" d="${line}"/>`
    + `<circle class="nowDot" cx="${x(pts.length-1).toFixed(1)}" cy="${y(last).toFixed(1)}" r="4"/>`;
  const p = document.getElementById("tp");
  p.style.setProperty("--len", p.getTotalLength());
  document.getElementById("traceCaption").textContent = scores.length > 1
    ? `${scores.length} assessment runs. Latest ${last}, first ${scores[0]}.`
    : "First assessment run. Remediate, run again, and the line will move.";
}

function esc(s){ return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
load();
</script>
</body>
</html>
